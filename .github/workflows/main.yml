name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git \
            libncurses5-dev libssl-dev make python3 unzip wget zip

      - name: Clone Xiaomi kernel
        run: |
          git clone --depth=1 -b dandelion-q-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Configure
        run: |
          mkdir -p kernel/arch/arm64/configs

          printf '%s\n' \
            'CONFIG_LOCALVERSION="-nethunter"' \
            'CONFIG_PACKET=y' \
            'CONFIG_UNIX=y' \
            'CONFIG_INET=y' \
            'CONFIG_IP_ADVANCED_ROUTER=y' \
            'CONFIG_IP_MULTIPLE_TABLES=y' \
            'CONFIG_IP_ROUTE_MULTIPATH=y' \
            'CONFIG_NETFILTER=y' \
            'CONFIG_NETFILTER_ADVANCED=y' \
            'CONFIG_USB_GADGET=y' \
            'CONFIG_USB_CONFIGFS=y' \
            'CONFIG_USB_CONFIGFS_HID=y' \
            'CONFIG_USB_CONFIGFS_RNDIS=y' \
            'CONFIG_USB_CONFIGFS_MASS_STORAGE=y' \
            'CONFIG_USB_HID=y' \
            'CONFIG_HID_GENERIC=y' \
            'CONFIG_USB_NET_RNDIS_HOST=m' \
            'CONFIG_USB_NET_CDCETHER=m' \
            'CONFIG_USB_NET_CDC_NCM=m' \
            'CONFIG_USB_NET_AX88179_178A=m' \
            'CONFIG_CFG80211=m' \
            'CONFIG_MAC80211=m' \
            'CONFIG_MAC80211_MESH=y' \
            'CONFIG_EXT4_FS=y' \
            'CONFIG_FUSE_FS=y' \
            'CONFIG_DEBUG_FS=y' \
            'CONFIG_PROC_FS=y' \
            'CONFIG_SYSFS=y' \
            > kernel/arch/arm64/configs/dandelion_defconfig

          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS=-Wno-error
          export HOSTCFLAGS=-Wno-error

          make dandelion_defconfig

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS=-Wno-error
          export HOSTCFLAGS=-Wno-error

          sed -i '/^[[:space:]]*dtbs:[[:space:]]*prepare[[:space:]]*scripts[[:space:]]*dtbo_check[[:space:]]*$/c\dtbs: prepare scripts' arch/arm64/Makefile

          echo "Checking dtbo_check dependency:"
          grep -n "dtbo_check" arch/arm64/Makefile || true

          make -j$(nproc) Image.gz-dtb

      - name: Create flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel

          cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel/

          cd AnyKernel
          zip -r9 ../nethunter-dandelion-kernel.zip ./*

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-dandelion-kernel
          path: nethunter-dandelion-kernel.zip
